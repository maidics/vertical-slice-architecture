name: CI

permissions:
  id-token: write
  contents: read

on:
  push:
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '**.md'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'renovate.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # cancels in progress run if pushing again

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # enable GitHub OIDC token issuance for this job

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run pipeline
        run: dotnet run --project src/VsaTemplate.Pipeline/VsaTemplate.Pipeline.csproj -c Release
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}