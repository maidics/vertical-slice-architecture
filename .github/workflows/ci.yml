name: CI

on: 
  push: 
    branches: ['**'] # runs on all branches, but pack & publish only ran on master branch
  pull_request: 
      branches: [ master ]

jobs: # only runs pack -> test if there changes to something that is not inside .github/
  ci: # only runs publish if there are changes to something that is not inside .github/ AND it is a push to master branch
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      pull-requests: read
      id-token: write # enable GitHub OIDC token issuance for this job
      
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: 'every'
          filters: |
            relevant:
              - '**'
              - '!.github/**'
              - '!docs/**'
            
      - name: Announce skip
        if: steps.filter.outputs.relevant == 'false'
        run: echo "::notice::Skipping CI/publish — only .github files changed"

      - uses: actions/setup-dotnet@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          global-json-file: ./global.json

      - name: Pack Template
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet pack nuspec.csproj

      - name: Install Template
        if: steps.filter.outputs.relevant == 'true'
        run: |
          count=$(ls ./artifacts/package/release/*.nupkg 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 .nupkg, found $count"
            exit 1
          fi
          dotnet new install ./artifacts/package/release/*.nupkg

      - name: Instantiate Template
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet new vsa-sln -n CiInstantiated -o ./ci-instantiated

      - name: Build Instantiated
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet build ./ci-instantiated/CiInstantiated.slnx

      - name: Test Instantiated
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet test ./ci-instantiated/CiInstantiated.slnx

      - name: NuGet Login # retrieves the short-lived API key from NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.filter.outputs.relevant == 'true' # only publish if it is merging into master
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.filter.outputs.relevant == 'true' # only publish if it is merging into master
        run: dotnet nuget push "./artifacts/package/release/*.nupkg" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json