name: CI

on:
  push:
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '**.md'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'renovate.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # cancels in progress run if pushing again

jobs: # only runs pack -> test if there changes to something that is not inside .github/
  pipeline: # only runs publish if a new tag is pushed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # enable GitHub OIDC token issuance for this job

    steps:
      - name: Checkout
      - uses: actions/checkout@v4

      - name: Announce skip
        if: steps.filter.outputs.relevant == 'false'
        run: echo "::notice::Skipping CI/publish — only .github files changed"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run pipeline
        run: dotnet run --project src/VsaTemplate.Pipeline/VsaTemplate.Pipeline.csproj -c Release